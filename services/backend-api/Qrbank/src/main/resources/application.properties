spring.application.name=Qrbank

# =========================
# R2DBC (WebFlux)
# =========================
spring.r2dbc.url=r2dbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.r2dbc.username=${MYSQLUSER}
spring.r2dbc.password=${MYSQLPASSWORD}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh_expiration=604800000

# =========================
# MYSQL - JDBC (Flyway use it)
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# FLYWAY (MIGRATIONS)
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true


# =========================
# EMAIL - GMAIL SMTP
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

